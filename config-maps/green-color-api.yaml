apiVersion: v1
kind: Pod
metadata:
  name: green-color-api
  labels:
    app: green-color-api
spec:
  containers:
    - name: color-api
      image: rish589/color-api:1.3.0
      envFrom:
        - configMapRef:
            name: green-env-vars
      volumeMounts:
        - name: color-config
          mountPath: /mnt/config
          readOnly: true
      resources:
        limits:
          cpu: "500m"
          memory: "128Mi"
      ports:
        - containerPort: 80
  volumes:
    - name: color-config
      configMap:
        name: green-files