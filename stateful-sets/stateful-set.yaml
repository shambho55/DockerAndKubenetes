apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-ss
spec:
  serviceName: busybox
  replicas: 2
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
        - name: busybox
          image: busybox:1.36.1
          command:
            - 'sh'
            - '-c'
            - 'sleep 3600'
          resources:
            limits:
              cpu: '500m'
              memory: '128Mi'
          volumeMounts:
            - name: local-storage
              mountPath: /mnt/local
            - name: local-storage2
              mountPath: /mnt/local2
  volumeClaimTemplates:
    - metadata: 
        name: local-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 128Mi
    - metadata: 
        name: local-storage2
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 128Mi