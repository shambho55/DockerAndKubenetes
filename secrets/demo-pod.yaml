apiVersion: v1
kind: Pod
metadata:
  name: busybox
  labels:
    app: busybox
spec:
  containers:
    - name: busybox
      image: busybox:1.36.1
      command:
        - 'sh'
        - '-c'
        - 'echo "$username" && echo "$password" && sleep 1800s'
      resources:
        limits:
          cpu: "500m"
          memory: "128Mi"
      volumeMounts:
        - name: db-secrets
          mountPath: /etc/db
  volumes:
    - name: db-secrets
      secret:
        secretName: db-creds
        items:
          - key: username
            path: dev/password